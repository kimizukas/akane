[project]
name = "VampireMusic"
version = "3.0.3"
description = "Telegram music bot with Taalune FastAPI Mini App."
readme = ".github/README.md"
requires-python = ">=3.10"
keywords = [
    "telegram",
    "music-bot",
    "voice-chat",
    "fastapi",
    "pyrogram"
]

dependencies = [
    "aiohttp~=3.14.0",
    "aiofiles==24.1.0",
    "kurigram>=2.2.21",
    "pillow~=12.2.0",
    "psutil~=7.2.2",
    "py-tgcalls~=2.3.0",
    "py-yt-search>=0.6.2,<0.8.0",
    "pymongo>=4.16.0",
    "pytgcrypto>=1.2.11",
    "python-dotenv~=1.2.1",
    "yt-dlp[default]>=2026.3.17",
    "static_ffmpeg>=3.0",

    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.34,<1.0",
    "httpx>=0.28,<1.0",
    "python-multipart>=0.0.20,<1.0",
    "pydantic>=2.10,<3.0"
]

[project.urls]
Homepage = "https://github.com/rockyxd3/Auro"
Repository = "https://github.com/rockyxd3/Auro"