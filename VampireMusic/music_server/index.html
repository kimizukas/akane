
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#101014">
<title>Vampire Music</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root {
    color-scheme: dark;
    --bg: #101014;
    --panel: #1a1a21;
    --panel2: #24242d;
    --text: #f5f5f7;
    --muted: #9999a8;
    --accent: #a78bfa;
    --border: #30303a;
}
* { box-sizing: border-box; }
body {
    margin: 0;
    padding: 18px;
    padding-bottom: 145px;
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, sans-serif;
}
header {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 25px;
}
.avatar {
    width: 46px;
    height: 46px;
    border-radius: 50%;
    object-fit: cover;
    background: var(--panel2);
}
h1 { font-size: 21px; margin: 0; }
.subtitle { color: var(--muted); font-size: 12px; }
.search {
    display: flex;
    gap: 9px;
    margin: 20px 0;
}
input {
    flex: 1;
    min-width: 0;
    border: 1px solid var(--border);
    border-radius: 13px;
    background: var(--panel);
    color: white;
    padding: 14px;
    outline: none;
    font-size: 14px;
}
button {
    border: 0;
    border-radius: 12px;
    padding: 12px 16px;
    background: var(--accent);
    color: #17131f;
    font-weight: 700;
    cursor: pointer;
}
button:disabled { opacity: .5; }
.section-title {
    font-size: 15px;
    font-weight: 700;
    margin: 22px 0 12px;
}
#status {
    color: var(--muted);
    font-size: 13px;
    margin: 12px 0;
}
.track {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 14px;
    margin-bottom: 9px;
}
.track img {
    width: 65px;
    height: 65px;
    object-fit: cover;
    border-radius: 9px;
    background: var(--panel2);
}
.track-info { flex: 1; min-width: 0; }
.track-title {
    font-size: 13px;
    font-weight: 650;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}
.track-artist, .track-duration {
    color: var(--muted);
    font-size: 11px;
    margin-top: 5px;
}
.play-btn {
    width: 42px;
    height: 42px;
    border-radius: 50%;
    padding: 0;
    flex-shrink: 0;
}
.player {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    padding: 13px 17px calc(13px + env(safe-area-inset-bottom));
    background: #191920;
    border-top: 1px solid var(--border);
}
.now-playing {
    display: flex;
    align-items: center;
    gap: 11px;
}
.now-playing img {
    width: 45px;
    height: 45px;
    border-radius: 8px;
    object-fit: cover;
}
.now-info { flex: 1; min-width: 0; }
.now-title {
    font-size: 12px;
    font-weight: 700;
    overflow: hidden;
    white-space: nowrap;
    text-overflow: ellipsis;
}
.now-artist { font-size: 11px; color: var(--muted); }
#playState { font-size: 11px; color: var(--muted); margin-top: 8px; }
audio { display: none; }
</style>
</head>
<body>

<header>
    <img class="avatar" id="avatar" alt="">
    <div>
        <h1>Vampire Music</h1>
        <div class="subtitle" id="welcome">Your music space</div>
    </div>
</header>

<div class="section-title">Discover music</div>

<form class="search" id="searchForm">
    <input id="query" maxlength="200" placeholder="Search songs or artists..." autocomplete="off">
    <button id="searchButton" type="submit">Search</button>
</form>

<div id="status">Search for a song to get started.</div>
<div id="results"></div>

<div class="player">
    <div class="now-playing">
        <img id="currentThumb" alt="">
        <div class="now-info">
            <div class="now-title" id="currentTitle">Nothing playing</div>
            <div class="now-artist" id="currentArtist">Choose a track</div>
        </div>
        <button id="toggleButton" class="play-btn" type="button">▶</button>
    </div>
    <div id="playState">Ready</div>
</div>

<audio id="audio" preload="none"></audio>

<script>
(() => {
    const tg = window.Telegram?.WebApp;
    const audio = document.getElementById("audio");

    const $ = (id) => document.getElementById(id);

    if (tg) {
        tg.ready();
        tg.expand();

        const user = tg.initDataUnsafe?.user;

        if (user) {
            $("welcome").textContent =
                `Welcome, ${user.first_name || "listener"}`;

            if (user.photo_url) {
                $("avatar").src = user.photo_url;
            }
        }
    }

    const initData = tg?.initData || "";

    function api(path, options = {}) {
        return fetch(path, {
            ...options,
            headers: {
                ...(options.headers || {}),
                "X-Telegram-Init-Data": initData
            }
        });
    }

    function duration(value) {
        const seconds = Number(value || 0);
        const minutes = Math.floor(seconds / 60);
        const remainder = seconds % 60;
        return `${minutes}:${String(remainder).padStart(2, "0")}`;
    }

    function playTrack(track) {
        audio.src = track.stream_url;
        audio.load();

        $("currentTitle").textContent = track.title;
        $("currentArtist").textContent = track.artist || "Unknown artist";
        $("currentThumb").src = track.thumbnail || "";

        audio.play().then(() => {
            $("toggleButton").textContent = "Ⅱ";
            $("playState").textContent = "Playing";
        }).catch(() => {
            $("playState").textContent =
                "Playback failed. Tap play to retry.";
        });
    }

    function renderTracks(tracks) {
        const results = $("results");
        results.replaceChildren();

        if (!tracks.length) {
            $("status").textContent = "No results found.";
            return;
        }

        $("status").textContent = `${tracks.length} tracks found`;

        for (const track of tracks) {
            const card = document.createElement("div");
            card.className = "track";

            const image = document.createElement("img");
            image.src = track.thumbnail || "";
            image.alt = "";

            const info = document.createElement("div");
            info.className = "track-info";

            const title = document.createElement("div");
            title.className = "track-title";
            title.textContent = track.title;

            const artist = document.createElement("div");
            artist.className = "track-artist";
            artist.textContent = track.artist || "Unknown artist";

            const time = document.createElement("div");
            time.className = "track-duration";
            time.textContent = duration(track.duration_sec);

            info.append(title, artist, time);

            const play = document.createElement("button");
            play.className = "play-btn";
            play.type = "button";
            play.textContent = "▶";
            play.addEventListener("click", () => playTrack(track));

            card.append(image, info, play);
            results.append(card);
        }
    }

    $("searchForm").addEventListener("submit", async (event) => {
        event.preventDefault();

        if (!initData) {
            $("status").textContent =
                "Open this page from Telegram Mini App.";
            return;
        }

        const query = $("query").value.trim();

        if (!query) return;

        $("searchButton").disabled = true;
        $("status").textContent = "Searching...";
        $("results").replaceChildren();

        try {
            const response = await api("/api/search", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({ query })
            });

            const data = await response.json();

            if (!response.ok || !data.ok) {
                throw new Error(data.error || "Search failed");
            }

            renderTracks(data.results || []);

        } catch (error) {
            $("status").textContent = error.message;
        } finally {
            $("searchButton").disabled = false;
        }
    });

    $("toggleButton").addEventListener("click", () => {
        if (!audio.src) return;

        if (audio.paused) {
            audio.play().then(() => {
                $("toggleButton").textContent = "Ⅱ";
                $("playState").textContent = "Playing";
            }).catch(() => {
                $("playState").textContent = "Unable to play.";
            });
        } else {
            audio.pause();
            $("toggleButton").textContent = "▶";
            $("playState").textContent = "Paused";
        }
    });

    audio.addEventListener("ended", () => {
        $("toggleButton").textContent = "▶";
        $("playState").textContent = "Finished";
    });

    audio.addEventListener("error", () => {
        $("toggleButton").textContent = "▶";
        $("playState").textContent = "Audio could not be loaded.";
    });
})();
</script>
</body>
</html>
