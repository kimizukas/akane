<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#101010">
  <meta name="color-scheme" content="dark">
  <meta name="description" content="Taalune — music, playlists and group listening.">
  <title>Taalune — Music</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="/music/assets/taalune.css?v=20261112-2">
  <script defer src="/music/assets/taalune.js?v=20261112-2"></script>
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <a class="brand" href="#home" data-page="home" aria-label="Taalune home">
        <span class="brand-mark">t</span>
        <span class="brand-copy"><strong>Taalune</strong><small>Music, in your space</small></span>
      </a>
      <div class="top-actions">
        <button class="icon-button" data-page="notifications" aria-label="Notifications" title="Notifications">
          <svg viewBox="0 0 24 24"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M10 21h4"/></svg>
          <span id="notificationDot" class="notification-dot" hidden></span>
        </button>
        <button class="avatar-button" data-page="profile" aria-label="Open profile">
          <img id="topAvatar" class="avatar" alt="" hidden>
          <span id="topAvatarFallback" class="avatar-fallback">U</span>
        </button>
      </div>
    </header>

    <main id="mainContent" aria-live="polite">
      <section class="page active" id="page-home">
        <div class="loading-state"><span class="spinner"></span><span>Opening your music space…</span></div>
      </section>
      <section class="page" id="page-search"></section>
      <section class="page" id="page-library"></section>
      <section class="page" id="page-groups"></section>
      <section class="page" id="page-profile"></section>
      <section class="page" id="page-notifications"></section>
      <section class="page" id="page-playlist"></section>
      <section class="page" id="page-person"></section>
      <section class="page" id="page-settings"></section>
      <section class="page" id="page-admin"></section>
    </main>
  </div>

  <div class="mini-player" id="miniPlayer" hidden>
    <button class="mini-main" data-action="open-player" aria-label="Open player">
      <img id="miniCover" class="mini-cover" alt="">
      <span class="mini-track-info"><strong id="miniTitle">Nothing playing</strong><small id="miniArtist">Choose a song</small><span class="mini-progress"><span id="miniProgress"></span></span></span>
    </button>
    <div class="mini-controls">
      <button id="miniToggle" data-action="toggle-play" aria-label="Play or pause"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></button>
      <button data-action="next-track" aria-label="Next track"><svg viewBox="0 0 24 24"><path d="M5 5v14l10-7zM19 5v14"/></svg></button>
    </div>
  </div>

  <nav class="bottom-nav" aria-label="Main navigation">
    <button class="nav-button active" data-page="home"><svg viewBox="0 0 24 24"><path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"/></svg><span>Home</span></button>
    <button class="nav-button" data-page="search"><svg viewBox="0 0 24 24"><circle cx="10.8" cy="10.8" r="7.2"/><path d="m16.2 16.2 4.3 4.3"/></svg><span>Search</span></button>
    <button class="nav-button" data-page="library"><svg viewBox="0 0 24 24"><path d="M4 4h16v16H4zM8 8h8M8 12h8M8 16h5"/></svg><span>Library</span></button>
    <button class="nav-button" data-page="groups"><svg viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg><span>Groups</span></button>
    <button class="nav-button" data-page="profile"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg><span>Profile</span></button>
  </nav>

  <div class="overlay" id="modalOverlay" aria-hidden="true">
    <section class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <div class="modal-handle"></div>
      <header class="modal-header"><div><span class="eyebrow">Taalune</span><h2 id="modalTitle">Details</h2></div><button class="icon-button" data-action="close-modal" aria-label="Close"><svg viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></svg></button></header>
      <div id="modalBody" class="modal-body"></div>
      <footer id="modalFooter" class="modal-footer"></footer>
    </section>
  </div>

  <section class="player-full" id="fullPlayer" aria-label="Personal music player" aria-hidden="true">
    <header class="player-topbar">
      <button class="icon-button" data-action="close-player" aria-label="Close player"><svg viewBox="0 0 24 24"><path d="m6 15 6-6 6 6"/></svg></button>
      <span class="player-source-label">NOW PLAYING</span>
      <button class="icon-button" data-action="open-queue" aria-label="Open queue"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10"/></svg></button>
    </header>
    <div class="player-layout">
      <div class="player-art-wrap"><img id="fullCover" class="player-art" alt=""></div>
      <div class="player-track-details"><div><strong id="fullTitle">Nothing playing</strong><span id="fullArtist">Choose a song</span></div><button class="icon-button" data-action="like-current" aria-label="Like current song"><svg viewBox="0 0 24 24"><path d="M20.8 8.8c0 5.2-8.8 11-8.8 11S3.2 14 3.2 8.8A4.8 4.8 0 0 1 12 6.2a4.8 4.8 0 0 1 8.8 2.6Z"/></svg></button></div>
      <div class="player-progress"><input id="seek" type="range" min="0" max="1000" value="0" aria-label="Seek song"><div class="time-row"><span id="elapsed">0:00</span><span id="remaining">--:--</span></div></div>
      <div class="player-transport">
        <button id="shuffleButton" data-action="shuffle" aria-label="Shuffle"><svg viewBox="0 0 24 24"><path d="m16 3 4 4-4 4M4 17l5-5 3-3 4-3h4M16 17l4 4-4 4M4 7l5 5 3 3"/></svg></button>
        <button data-action="previous-track" aria-label="Previous track"><svg viewBox="0 0 24 24"><path d="M19 5v14L9 12zM5 5v14"/></svg></button>
        <button id="fullToggle" class="main-play-button" data-action="toggle-play" aria-label="Play or pause"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></button>
        <button data-action="next-track" aria-label="Next track"><svg viewBox="0 0 24 24"><path d="M5 5v14l10-7zM19 5v14"/></svg></button>
        <button id="repeatButton" data-action="repeat" aria-label="Repeat off"><svg viewBox="0 0 24 24"><path d="m17 1 4 4-4 4M3 11V9a4 4 0 0 1 4-4h14M7 23l-4-4 4-4M21 13v2a4 4 0 0 1-4 4H3"/></svg></button>
      </div>
      <div class="player-extras">
        <label class="inline-control">Speed <select id="playbackSpeed"><option value="1">1×</option><option value="1.25">1.25×</option><option value="1.5">1.5×</option><option value="1.75">1.75×</option><option value="2">2×</option></select></label>
        <label class="inline-control">Volume <input id="volume" type="range" min="0" max="100" value="85"></label>
        <button class="text-button" data-action="sleep-timer">Sleep timer</button>
      </div>
      <button class="secondary-button full-width" data-action="open-queue">View queue</button>
    </div>
  </section>

  <div class="overlay" id="queueOverlay" aria-hidden="true">
    <section class="modal queue-modal" role="dialog" aria-modal="true" aria-labelledby="queueTitle">
      <div class="modal-handle"></div>
      <header class="modal-header"><div><span class="eyebrow">Personal player</span><h2 id="queueTitle">Your queue</h2><p id="queueCaption" class="muted small"></p></div><button class="icon-button" data-action="close-queue" aria-label="Close queue"><svg viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></svg></button></header>
      <div id="queueItems" class="queue-list"></div>
    </section>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <audio id="audio" preload="none"></audio>
</body>
</html>
