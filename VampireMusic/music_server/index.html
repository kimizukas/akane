
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#120e16">
<title>Taalune — Your music, your space</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root {
  color-scheme: dark;
  --bg: #120e16;
  --surface: #1c1622;
  --surface2: #271e2d;
  --surface3: #33283a;
  --text: #fbf2f8;
  --muted: #b9aabd;
  --line: #3c3043;
  --accent: #e8afd0;
  --accent2: #c986b7;
  --danger: #f08091;
  --safe-bottom: env(safe-area-inset-bottom, 0px);
  --radius: 18px;
}

* { box-sizing: border-box; }
html, body {
  margin: 0;
  min-height: 100%;
  background: var(--bg);
  color: var(--text);
  font-family: Inter, ui-sans-serif, system-ui, -apple-system,
    "Segoe UI", sans-serif;
}
body {
  padding-bottom: calc(148px + var(--safe-bottom));
  -webkit-tap-highlight-color: transparent;
  background:
    radial-gradient(ellipse at 50% -20%, rgba(179, 112, 166, .16), transparent 52%),
    var(--bg);
}
button, input, textarea, select { font: inherit; }
button {
  border: 0;
  color: inherit;
  cursor: pointer;
  transition: transform .16s ease, background-color .18s ease,
    color .18s ease, opacity .18s ease;
}
button:active { transform: scale(.96); }
button:disabled { opacity: .42; cursor: default; }
input, textarea, select { color: var(--text); }
.app { max-width: 760px; margin: 0 auto; padding: 0 18px; }

.topbar {
  height: 66px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  position: sticky;
  top: 0;
  z-index: 10;
  margin: 0 -18px;
  padding: 0 18px;
  background: rgba(18, 14, 22, .92);
  backdrop-filter: blur(18px);
  border-bottom: 1px solid rgba(232, 175, 208, .08);
}
.brand {
  display: flex;
  align-items: center;
  gap: 11px;
  font-size: 21px;
  font-weight: 800;
  letter-spacing: -.7px;
}
.brand-mark {
  width: 35px;
  height: 35px;
  display: grid;
  place-items: center;
  border-radius: 12px;
  background: linear-gradient(145deg, #f0c6df, #c98db9);
  color: #281827;
  font-size: 19px;
  font-weight: 900;
  box-shadow: 0 5px 20px rgba(201, 141, 185, .18);
}
.top-actions { display: flex; align-items: center; gap: 7px; }
.icon-btn {
  min-width: 40px;
  width: 40px;
  height: 40px;
  display: grid;
  place-items: center;
  border-radius: 50%;
  background: transparent;
  color: var(--text);
  font-size: 19px;
}
.avatar {
  width: 36px;
  height: 36px;
  border-radius: 50%;
  object-fit: cover;
  background: var(--surface3);
  cursor: pointer;
}

.page { display: none; padding-top: 17px; }
.page.active {
  display: block;
  animation: page-in .3s cubic-bezier(.2,.75,.25,1) both;
}
@keyframes page-in {
  from { opacity: 0; transform: translateY(12px); filter: blur(2px); }
  to { opacity: 1; transform: translateY(0); filter: blur(0); }
}

.eyebrow {
  color: var(--muted);
  font-size: 11px;
  letter-spacing: 1.35px;
  text-transform: uppercase;
  font-weight: 750;
}
.page-title {
  font-size: 29px;
  letter-spacing: -1px;
  line-height: 1.12;
  margin: 7px 0 18px;
  font-weight: 800;
}
.section-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin: 27px 0 13px;
}
.section-head h2 { margin: 0; font-size: 18px; letter-spacing: -.3px; }
.section-head button {
  background: transparent;
  color: var(--muted);
  font-size: 13px;
}
.muted { color: var(--muted); }
.small { font-size: 12px; }
.row { display: flex; align-items: center; gap: 10px; }
.grow { flex: 1; min-width: 0; }
.pill-row {
  display: flex;
  gap: 8px;
  overflow-x: auto;
  padding: 3px 0 9px;
  scrollbar-width: none;
}
.pill-row::-webkit-scrollbar { display: none; }
.pill {
  white-space: nowrap;
  border-radius: 999px;
  padding: 10px 15px;
  background: var(--surface2);
  color: var(--text);
  font-size: 13px;
}
.pill.active { background: var(--accent); color: #281827; font-weight: 750; }
.primary {
  background: linear-gradient(135deg, #f0c3dd, #d99fc5);
  color: #281827;
  font-weight: 800;
  border-radius: 999px;
  padding: 12px 17px;
  box-shadow: 0 6px 18px rgba(217,159,197,.13);
}
.secondary {
  background: var(--surface3);
  border: 1px solid rgba(232,175,208,.08);
  border-radius: 999px;
  padding: 11px 15px;
  font-weight: 650;
}
.ghost { background: transparent; color: var(--muted); padding: 10px; }
.danger {
  background: rgba(240,128,145,.13);
  color: var(--danger);
  border-radius: 999px;
  padding: 10px 14px;
}
.searchbar {
  display: flex;
  align-items: center;
  gap: 10px;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 15px;
  padding: 0 14px;
  margin: 12px 0 14px;
}
.searchbar input {
  width: 100%;
  height: 49px;
  background: transparent;
  border: 0;
  outline: 0;
  color: var(--text);
  font-size: 15px;
}
.searchbar:focus-within { border-color: var(--accent2); }

.grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0,1fr));
  gap: 13px;
}
.playlist-card {
  min-width: 0;
  padding: 11px;
  border-radius: 16px;
  background: var(--surface);
  border: 1px solid var(--line);
  transition: transform .2s ease, border-color .2s ease;
}
.playlist-card:active { transform: scale(.985); }
.cover {
  width: 100%;
  aspect-ratio: 1;
  object-fit: cover;
  border-radius: 11px;
  background: var(--surface3);
  display: block;
}
.cover-placeholder {
  display: grid;
  place-items: center;
  background: linear-gradient(145deg, #3b2940, #201824);
  font-size: 45px;
  color: var(--accent);
}
.card-title {
  margin-top: 10px;
  overflow: hidden;
  white-space: nowrap;
  text-overflow: ellipsis;
  font-size: 14px;
  font-weight: 750;
}
.card-meta { margin-top: 4px; color: var(--muted); font-size: 12px; }

.list { display: flex; flex-direction: column; gap: 7px; }
.track-row {
  display: flex;
  align-items: center;
  gap: 10px;
  min-width: 0;
  padding: 9px;
  border-radius: 13px;
  background: var(--surface);
  border: 1px solid transparent;
  transition: background-color .18s ease, border-color .18s ease,
    transform .18s ease;
}
.track-row.dragging { opacity: .4; }
.track-row.drag-over { border-color: var(--accent); }
.track-cover {
  width: 52px;
  height: 52px;
  flex-shrink: 0;
  object-fit: cover;
  border-radius: 9px;
  background: var(--surface3);
}
.track-title {
  overflow: hidden;
  white-space: nowrap;
  text-overflow: ellipsis;
  font-size: 14px;
  font-weight: 700;
}
.track-sub {
  overflow: hidden;
  white-space: nowrap;
  text-overflow: ellipsis;
  margin-top: 4px;
  color: var(--muted);
  font-size: 12px;
}
.track-actions { display: flex; align-items: center; gap: 2px; }
.track-action {
  width: 34px;
  height: 35px;
  border-radius: 50%;
  background: transparent;
  color: var(--muted);
  font-size: 17px;
}
.track-action:active { background: var(--surface3); }
.play-circle {
  width: 40px;
  height: 40px;
  flex-shrink: 0;
  border-radius: 50%;
  background: var(--accent);
  color: #281827;
  font-size: 15px;
  font-weight: 850;
}
.track-grip { color: var(--muted); padding: 3px; cursor: grab; }
.track-management { display: flex; gap: 3px; }
.track-management button {
  width: 29px;
  height: 31px;
  background: var(--surface3);
  border-radius: 9px;
  color: var(--muted);
}
.remove-track { color: var(--danger); }

.person-row {
  display: flex;
  align-items: center;
  gap: 11px;
  padding: 11px 2px;
  border-bottom: 1px solid var(--line);
}
.person-avatar {
  width: 45px;
  height: 45px;
  flex-shrink: 0;
  border-radius: 50%;
  object-fit: cover;
  background: var(--surface3);
}
.empty {
  padding: 34px 18px;
  text-align: center;
  color: var(--muted);
  background: var(--surface);
  border: 1px dashed var(--line);
  border-radius: 16px;
  font-size: 14px;
}

.field { display: flex; flex-direction: column; gap: 7px; margin: 12px 0; }
.field label { color: var(--muted); font-size: 12px; font-weight: 700; }
.field input, .field textarea, .field select {
  width: 100%;
  padding: 13px;
  outline: 0;
  border: 1px solid var(--line);
  border-radius: 12px;
  background: var(--surface2);
  color: var(--text);
}
.field textarea { min-height: 82px; resize: vertical; }
.field input:focus, .field textarea:focus, .field select:focus {
  border-color: var(--accent2);
}

.bottom-nav {
  position: fixed;
  z-index: 20;
  left: 0;
  right: 0;
  bottom: 0;
  display: flex;
  justify-content: space-around;
  padding: 9px 10px calc(9px + var(--safe-bottom));
  background: rgba(24,18,29,.96);
  backdrop-filter: blur(20px);
  border-top: 1px solid var(--line);
}
.nav-btn {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  min-width: 57px;
  background: transparent;
  color: var(--muted);
  font-size: 10px;
}
.nav-icon { font-size: 20px; line-height: 22px; }
.nav-btn.active { color: var(--accent); transform: translateY(-2px); }

.mini-player {
  position: fixed;
  z-index: 19;
  left: 10px;
  right: 10px;
  bottom: calc(70px + var(--safe-bottom));
  max-width: 740px;
  margin: auto;
  display: none;
  align-items: center;
  gap: 10px;
  padding: 9px 11px;
  border: 1px solid #49354b;
  border-radius: 14px;
  background: rgba( forty, 28, 44, .97);
  background: #2a2030;
  box-shadow: 0 8px 30px #0007;
}
.mini-player.visible { display: flex; animation: mini-in .22s ease-out both; }
@keyframes mini-in {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: translateY(0); }
}
.mini-player img {
  width: 43px;
  height: 43px;
  object-fit: cover;
  border-radius: 8px;
  background: var(--surface3);
}
.mini-title {
  overflow: hidden;
  white-space: nowrap;
  text-overflow: ellipsis;
  font-size: 12px;
  font-weight: 750;
}
.mini-sub {
  overflow: hidden;
  white-space: nowrap;
  text-overflow: ellipsis;
  margin-top: 3px;
  color: var(--muted);
  font-size: 11px;
}
.mini-controls { display: flex; gap: 2px; }
.mini-controls button {
  width: 37px;
  height: 38px;
  border-radius: 50%;
  background: transparent;
  font-size: 17px;
}
.progress {
  height: 3px;
  width: 100%;
  margin-top: 7px;
  overflow: hidden;
  border-radius: 5px;
  background: #594b5b;
}
.progress > span {
  display: block;
  height: 100%;
  width: 0;
  background: var(--accent);
}

.overlay {
  position: fixed;
  z-index: 40;
  inset: 0;
  display: none;
  align-items: flex-end;
  justify-content: center;
  background: rgba(0,0,0,.62);
}
.overlay.open { display: flex; animation: overlay-in .18s ease both; }
@keyframes overlay-in { from { opacity: 0; } to { opacity: 1; } }
.sheet {
  width: 100%;
  max-width: 760px;
  max-height: 90dvh;
  overflow: auto;
  padding: 19px 18px calc(22px + var(--safe-bottom));
  border: 1px solid #49384d;
  border-radius: 23px 23px 0 0;
  background: #211927;
  box-shadow: 0 -12px 50px #0008;
  animation: sheet-in .3s cubic-bezier(.18,.8,.25,1) both;
}
@keyframes sheet-in {
  from { opacity: .6; transform: translateY(48px); }
  to { opacity: 1; transform: translateY(0); }
}
.sheet-handle {
  width: 38px;
  height: 4px;
  margin: 0 auto 17px;
  border-radius: 8px;
  background: #806b82;
}
.sheet-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 14px;
}
.sheet-head h2 { margin: 0; font-size: 20px; }
.sheet-close {
  width: 32px;
  height: 32px;
  border-radius: 50%;
  background: var(--surface3);
}
.sheet-actions {
  display: flex;
  justify-content: flex-end;
  flex-wrap: wrap;
  gap: 9px;
  margin-top: 18px;
}

.toast {
  position: fixed;
  z-index: 60;
  left: 18px;
  right: 18px;
  bottom: calc(135px + var(--safe-bottom));
  max-width: 500px;
  margin: auto;
  padding: 13px 16px;
  border-radius: 13px;
  background: #f4eaf1;
  color: #211625;
  font-size: 13px;
  font-weight: 750;
  box-shadow: 0 8px 28px #0008;
  display: none;
}
.toast.show { display: block; animation: toast-in .22s ease-out both; }
@keyframes toast-in {
  from { opacity: 0; transform: translateY(10px) scale(.98); }
  to { opacity: 1; transform: translateY(0) scale(1); }
}

.detail-head {
  display: flex;
  align-items: flex-end;
  gap: 15px;
  margin: 15px 0 19px;
}
.detail-cover {
  width: 128px;
  height: 128px;
  flex-shrink: 0;
  object-fit: cover;
  border-radius: 13px;
  background: var(--surface3);
}
.detail-name {
  font-size: 23px;
  line-height: 1.08;
  font-weight: 820;
  letter-spacing: -.7px;
  overflow-wrap: anywhere;
}
.detail-actions { display: flex; flex-wrap: wrap; gap: 8px; margin: 14px 0; }

.notification {
  display: flex;
  gap: 11px;
  padding: 13px;
  margin: 5px 0;
  border: 1px solid transparent;
  border-bottom-color: var(--line);
  border-radius: 14px;
}
.notification.unread {
  background: rgba(232,175,208,.07);
  border-color: rgba(232,175,208,.15);
}
.notification p { margin: 0; font-size: 13px; line-height: 1.42; }
.notification-actions { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 9px; }

.profile-head { text-align: center; padding: 18px 0; }
.profile-big-avatar {
  width: 88px;
  height: 88px;
  border-radius: 50%;
  object-fit: cover;
  background: var(--surface3);
  margin-bottom: 12px;
}
.stat-row { display: flex; justify-content: center; gap: 30px; margin: 15px 0; }
.stat strong { display: block; font-size: 18px; }
.stat span { color: var(--muted); font-size: 11px; }

.player-full {
  position: fixed;
  z-index: 35;
  inset: 0;
  display: none;
  flex-direction: column;
  overflow: auto;
  padding: calc(18px + env(safe-area-inset-top)) 20px
    calc(26px + var(--safe-bottom));
  background:
    radial-gradient(ellipse at 50% 32%, rgba(177,113,163,.13), transparent 55%),
    #120e16;
}
.player-full.open {
  display: flex;
  animation: player-in .34s cubic-bezier(.18,.8,.25,1) both;
}
@keyframes player-in {
  from { opacity: .4; transform: translateY(42px); }
  to { opacity: 1; transform: translateY(0); }
}
.player-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  color: var(--muted);
  font-size: 13px;
}
.player-art {
  width: min(84vw, 440px);
  aspect-ratio: 1;
  object-fit: cover;
  border-radius: 17px;
  margin: 32px auto 23px;
  background: var(--surface3);
  box-shadow: 0 16px 45px #0008;
}
.player-song { display: flex; align-items: center; gap: 12px; }
.player-song .name {
  overflow: hidden;
  white-space: nowrap;
  text-overflow: ellipsis;
  font-size: 21px;
  font-weight: 820;
}
.player-song .artist { margin-top: 6px; color: var(--muted); font-size: 14px; }
.player-progress { margin: 26px 0 5px; }
.player-progress input { width: 100%; accent-color: var(--accent); }
.time-row { display: flex; justify-content: space-between; color: var(--muted); font-size: 11px; }
.transport {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 4px;
  margin: 22px 0;
}
.transport button {
  width: 46px;
  height: 46px;
  border-radius: 50%;
  background: transparent;
  font-size: 21px;
}
.transport .main-play {
  width: 72px;
  height: 72px;
  border-radius: 50%;
  background: var(--text);
  color: #211625;
  font-size: 26px;
}
.player-bottom {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-top: auto;
  color: var(--muted);
}
.hidden { display: none !important; }
.divider { height: 1px; margin: 15px 0; background: var(--line); }
.group-panel {
  padding: 14px;
  border: 1px solid var(--line);
  border-radius: 17px;
  background: var(--surface);
}
.group-ok { color: var(--accent); font-weight: 750; }
.group-error { color: var(--danger); }

@media (min-width: 620px) {
  .grid { grid-template-columns: repeat(3,minmax(0,1fr)); }
  .page-title { font-size: 34px; }
  .detail-cover { width: 170px; height: 170px; }
}
@media (max-width: 390px) {
  .app { padding-left: 13px; padding-right: 13px; }
  .track-row { gap: 7px; padding: 7px; }
  .track-cover { width: 46px; height: 46px; }
  .track-action { width: 30px; }
  .play-circle { width: 36px; height: 36px; }
  .transport button { width: 39px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: .01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: .01ms !important;
    scroll-behavior: auto !important;
  }
}
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark">t</span>
      <span>Taalune</span>
    </div>
    <div class="top-actions">
      <button class="icon-btn" data-action="notifications" aria-label="Notifications">🔔</button>
      <img id="topAvatar" class="avatar" alt="" data-action="profile">
    </div>
  </header>

  <main>
    <section class="page active" id="page-home"></section>
    <section class="page" id="page-search"></section>
    <section class="page" id="page-library"></section>
    <section class="page" id="page-groups"></section>
    <section class="page" id="page-profile"></section>
    <section class="page" id="page-notifications"></section>
    <section class="page" id="page-playlist"></section>
    <section class="page" id="page-person"></section>
  </main>
</div>

<div class="mini-player" id="miniPlayer">
  <img id="miniCover" alt="">
  <div class="grow" data-action="open-player">
    <div class="mini-title" id="miniTitle">Nothing playing</div>
    <div class="mini-sub" id="miniArtist">Choose a song</div>
    <div class="progress"><span id="miniProgress"></span></div>
  </div>
  <div class="mini-controls">
    <button data-action="toggle-play" id="miniToggle">▶</button>
    <button data-action="next-track">»</button>
  </div>
</div>

<nav class="bottom-nav">
  <button class="nav-btn active" data-page="home"><span class="nav-icon">⌂</span><span>Home</span></button>
  <button class="nav-btn" data-page="search"><span class="nav-icon">⌕</span><span>Search</span></button>
  <button class="nav-btn" data-page="library"><span class="nav-icon">▤</span><span>Library</span></button>
  <button class="nav-btn" data-page="groups"><span class="nav-icon">♫</span><span>Groups</span></button>
  <button class="nav-btn" data-page="profile"><span class="nav-icon">●</span><span>Profile</span></button>
</nav>

<div class="overlay" id="sheetOverlay">
  <div class="sheet">
    <div class="sheet-handle"></div>
    <div class="sheet-head">
      <h2 id="sheetTitle">Create playlist</h2>
      <button class="sheet-close" data-action="close-sheet">×</button>
    </div>
    <div id="sheetBody"></div>
    <div class="sheet-actions" id="sheetActions"></div>
  </div>
</div>

<div class="overlay" id="queueOverlay">
  <div class="sheet">
    <div class="sheet-handle"></div>
    <div class="sheet-head">
      <div>
        <h2>Queue</h2>
        <div class="small muted" id="queueCaption"></div>
      </div>
      <button class="sheet-close" data-action="close-queue">×</button>
    </div>
    <div id="queueItems" class="list"></div>
  </div>
</div>

<div class="player-full" id="fullPlayer">
  <div class="player-top">
    <button class="icon-btn" data-action="close-player">⌄</button>
    <span>NOW PLAYING</span>
    <button class="icon-btn" data-action="queue">☷</button>
  </div>
  <img class="player-art" id="fullCover" alt="">
  <div class="player-song">
    <div class="grow">
      <div class="name" id="fullTitle">Nothing playing</div>
      <div class="artist" id="fullArtist">Choose a song</div>
    </div>
    <button class="icon-btn" data-action="like-current">♡</button>
  </div>
  <div class="player-progress">
    <input id="seek" type="range" min="0" max="1000" value="0">
    <div class="time-row"><span id="elapsed">0:00</span><span id="remaining">-0:00</span></div>
  </div>
  <div class="transport">
    <button data-action="shuffle" id="shuffleButton">⤨</button>
    <button data-action="previous-track">|◀</button>
    <button class="main-play" data-action="toggle-play" id="fullToggle">▶</button>
    <button data-action="next-track">▶|</button>
    <button data-action="repeat" id="repeatButton">↻</button>
  </div>
  <div class="player-bottom">
    <span id="playerSource">Personal listening</span>
    <button class="secondary" data-action="queue">Queue ☷</button>
  </div>
</div>

<div class="toast" id="toast"></div>
<audio id="audio" preload="none"></audio>

<script>
(() => {
  "use strict";

  const tg = window.Telegram?.WebApp;
  const initData = tg?.initData || "";
  const $ = id => document.getElementById(id);
  const audio = $("audio");

  const state = {
    page: "home",
    profile: null,
    playlists: [],
    discover: [],
    liked: [],
    notifications: [],
    searchMode: "music",
    searchQuery: "",
    searchResults: [],
    libraryScope: "mine",
    activePlaylist: null,
    activePerson: null,
    selectedGroup: null,
    groupStatus: null,
    addTargetPlaylist: null,
    queue: [],
    queueIndex: -1,
    currentTrack: null,
    shuffle: false,
    repeat: false,
    dragId: null,
    modalTrack: null,
    modalPeople: [],
    selectedInvite: null,
    searchRequest: 0,
    playbackRequest: 0
  };

  let searchTimer = null;

  if (tg) {
    tg.ready();
    tg.expand();
    try {
      tg.setHeaderColor("#120e16");
      tg.setBackgroundColor("#120e16");
    } catch (_) {}
  }

  const esc = value => String(value ?? "").replace(/[&<>"']/g, ch => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#39;"
  }[ch]));

  const shortTime = value => {
    const n = Math.max(0, Number(value) || 0);
    return `${Math.floor(n / 60)}:${String(Math.floor(n % 60)).padStart(2, "0")}`;
  };

  const img = (url, cls = "") => url
    ? `<img class="${cls}" src="${esc(url)}" alt="" loading="lazy" referrerpolicy="no-referrer">`
    : `<div class="${cls} cover-placeholder">♫</div>`;

  const showToast = message => {
    const el = $("toast");
    el.textContent = String(message || "Something went wrong");
    el.classList.add("show");
    clearTimeout(showToast.timer);
    showToast.timer = setTimeout(() => el.classList.remove("show"), 2800);
  };

  const API_MESSAGES = {
    unauthorized: "Open Taalune from the Telegram bot to sign in.",
    invalid_chat_id: "That Telegram group ID is invalid.",
    group_only: "Enter a Telegram supergroup ID.",
    supergroup_required: "This group must be a supergroup.",
    bot_cannot_access_group: "The music bot is not in this group or cannot access it.",
    assistant_unavailable: "The assigned music assistant is unavailable.",
    userbot_cannot_verify_membership: "The assistant could not verify your group membership.",
    not_group_member: "You are not a member of this group.",
    bot_not_in_group: "Add the music bot to this group first.",
    assistant_not_in_group: "The assigned assistant account is not in this group.",
    unable_to_verify_group_clients: "The bot and assistant membership could not be verified.",
    group_control_permission_denied: "You can view this group, but you cannot control its playback.",
    voice_chat_playback_not_started: "The voice chat is not active or playback could not start.",
    nothing_playing: "Nothing is playing in this group.",
    already_paused: "Group playback is already paused.",
    already_playing: "Group playback is already playing.",
    group_queue_limit: "The group queue is full.",
    playlist_empty: "This playlist has no songs yet.",
    duplicate_track: "This song is already in this playlist.",
    playlist_track_limit: "This playlist has reached its track limit.",
    playlist_version_conflict: "This playlist changed. Reload it and try again.",
    playlist_changed_retry: "This playlist changed. Reload and try again.",
    private_playlist: "You do not have access to this playlist.",
    private_playlist_cannot_be_followed: "Private playlists cannot be followed.",
    permission_denied: "You do not have permission to perform this action.",
    owner_only_visibility: "Only the playlist owner can change its visibility.",
    collaborator_not_found: "That collaborator is no longer on this playlist.",
    invitation_not_found: "This invitation is no longer available."
  };

  async function api(path, options = {}) {
    if (!initData) {
      throw new Error("Open Taalune from the Telegram bot to continue.");
    }

    const headers = {
      "X-Telegram-Init-Data": initData,
      ...(options.headers || {})
    };

    if (options.body && !headers["Content-Type"]) {
      headers["Content-Type"] = "application/json";
    }

    const response = await fetch(path, {
      ...options,
      headers
    });

    const contentType = response.headers.get("content-type") || "";
    const data = contentType.includes("application/json")
      ? await response.json()
      : {};

    if (!response.ok || data.ok === false) {
      const code = data.error || "";
      throw new Error(
        API_MESSAGES[code] ||
        data.message ||
        code ||
        `Request failed (${response.status})`
      );
    }

    return data;
  }

  function go(page) {
    state.page = page;

    document.querySelectorAll(".page").forEach(el => {
      el.classList.toggle("active", el.id === `page-${page}`);
    });

    document.querySelectorAll(".nav-btn").forEach(el => {
      el.classList.toggle("active", el.dataset.page === page);
    });

    window.scrollTo({ top: 0, behavior: "smooth" });

    if (page === "home") loadHome();
    if (page === "library") loadLibrary();
    if (page === "profile") renderProfile();
    if (page === "notifications") loadNotifications();
    if (page === "search") renderSearchShell();
    if (page === "groups") renderGroups();
    if (page === "playlist") renderPlaylist();
  }

  function setAvatar() {
    const p = state.profile;
    const el = $("topAvatar");
    el.src = p?.avatar_url || "";
    el.style.visibility = p?.avatar_url ? "visible" : "hidden";
  }

  function playlistCard(p) {
    return `
      <article class="playlist-card">
        <button class="ghost" style="padding:0;width:100%;text-align:left"
          data-action="open-playlist" data-id="${esc(p.id)}">
          ${img(p.cover_url, "cover")}
          <div class="card-title">${esc(p.name)}</div>
          <div class="card-meta">${esc(p.visibility)} · ${Number(p.track_count || 0)} songs</div>
        </button>
        <div class="row" style="justify-content:space-between;margin-top:8px">
          <span class="small muted">♥ ${Number(p.like_count || 0)}</span>
          ${p.owner?.user_id === state.profile?.user_id ? "" : `
            <button class="track-action" data-action="playlist-follow"
              data-id="${esc(p.id)}" aria-label="Follow playlist">
              ${p.followed ? "✓" : "＋"}
            </button>
          `}
        </div>
      </article>
    `;
  }

  function trackRow(track, index, options = {}) {
    return `
      <div class="track-row"
        ${options.draggable ? 'draggable="true"' : ""}
        data-track-id="${esc(track.id)}" data-index="${index}">
        ${options.draggable ? '<span class="track-grip" title="Drag to reorder">⠿</span>' : ""}
        ${img(track.thumbnail, "track-cover")}
        <div class="grow">
          <div class="track-title">${esc(track.title)}</div>
          <div class="track-sub">
            ${esc(track.artist || "Unknown artist")} · ${shortTime(track.duration_sec)}
          </div>
        </div>
        <div class="track-actions">
          <button class="track-action" data-action="like-track"
            data-id="${esc(track.id)}" title="Like">♡</button>
          ${options.add ? `
            <button class="track-action" data-action="add-track"
              data-id="${esc(track.id)}" title="Add to playlist">＋</button>
          ` : ""}
          ${options.group ? `
            <button class="track-action" data-action="group-track"
              data-id="${esc(track.id)}" title="Add to group queue">♫</button>
          ` : ""}
          ${options.reorder ? `
            <div class="track-management">
              <button data-action="move-track-up" data-id="${esc(track.id)}" title="Move up">↑</button>
              <button data-action="move-track-down" data-id="${esc(track.id)}" title="Move down">↓</button>
            </div>
          ` : ""}
          ${options.remove ? `
            <button class="track-action remove-track" data-action="remove-track"
              data-id="${esc(track.id)}" title="Remove from playlist">×</button>
          ` : ""}
          <button class="play-circle" data-action="play-track"
            data-id="${esc(track.id)}" title="Play">▶</button>
        </div>
      </div>
    `;
  }

  async function loadProfile() {
    const result = await api("/api/profile");
    state.profile = result.profile;
    setAvatar();
  }

  async function loadHome() {
    const page = $("page-home");

    page.innerHTML = `
      <div class="eyebrow">A quieter place for music</div>
      <h1 class="page-title">Your music,<br>your little world.</h1>
      <div class="row">
        <button class="primary" data-page="search">⌕ Find music</button>
        <button class="secondary" data-page="library">Your library</button>
      </div>
      <div class="section-head">
        <h2>Made for you</h2>
        <button data-page="search">Explore</button>
      </div>
      <div id="homeDiscover" class="grid">
        <div class="empty">Loading playlists…</div>
      </div>
      <div class="section-head">
        <h2>Your playlists</h2>
        <button data-page="library">See all</button>
      </div>
      <div id="homeMine" class="grid"></div>
    `;

    try {
      const [discover, mine] = await Promise.all([
        api("/api/playlists?scope=discover&limit=12"),
        api("/api/playlists?scope=mine&limit=12")
      ]);

      state.discover = discover.results || [];
      state.playlists = mine.results || [];

      $("homeDiscover").innerHTML = state.discover.length
        ? state.discover.map(playlistCard).join("")
        : '<div class="empty" style="grid-column:1/-1">Public playlists will appear here.</div>';

      $("homeMine").innerHTML = state.playlists.length
        ? state.playlists.map(playlistCard).join("")
        : '<div class="empty" style="grid-column:1/-1">Create your first playlist.</div>';

    } catch (error) {
      $("homeDiscover").innerHTML =
        `<div class="empty" style="grid-column:1/-1">${esc(error.message)}</div>`;
    }
  }

  function renderSearchShell() {
    $("page-search").innerHTML = `
      <div class="eyebrow">Find something to play</div>
      <h1 class="page-title">Search</h1>
      <div class="searchbar">
        <span>⌕</span>
        <input id="searchInput" autocomplete="off" maxlength="120"
          placeholder="Songs, people or playlists" value="${esc(state.searchQuery)}">
      </div>
      <div class="pill-row">
        <button class="pill ${state.searchMode === "music" ? "active" : ""}"
          data-search-mode="music">♫ Music</button>
        <button class="pill ${state.searchMode === "people" ? "active" : ""}"
          data-search-mode="people">People</button>
        <button class="pill ${state.searchMode === "playlists" ? "active" : ""}"
          data-search-mode="playlists">Playlists</button>
      </div>
      <div id="searchStatus" class="muted small" style="margin:12px 0">
        Search songs, find people or discover playlists.
      </div>
      <div id="searchResults" class="list"></div>
    `;

    if (state.searchQuery.length >= 2) {
      runSearch();
    }
  }

  async function runSearch() {
    const input = $("searchInput");
    if (!input) return;

    const query = input.value.trim();
    state.searchQuery = query;

    const results = $("searchResults");
    const status = $("searchStatus");

    if (query.length < 2) {
      status.textContent = "Type at least two characters.";
      results.replaceChildren();
      return;
    }

    const requestId = ++state.searchRequest;
    status.textContent = "Searching…";
    results.replaceChildren();

    try {
      let data;

      if (state.searchMode === "music") {
        data = await api("/api/search", {
          method: "POST",
          body: JSON.stringify({ query })
        });
      } else {
        data = await api(
          `/api/search/${state.searchMode}?q=${encodeURIComponent(query)}&limit=25`
        );
      }

      if (requestId !== state.searchRequest) return;

      state.searchResults = data.results || [];

      if (state.searchMode === "music") {
        results.className = "list";
        results.innerHTML = state.searchResults.length
          ? state.searchResults.map((track, index) =>
              trackRow(track, index, {
                add: true,
                group: Boolean(state.selectedGroup)
              })
            ).join("")
          : '<div class="empty">No songs found.</div>';

      } else if (state.searchMode === "people") {
        results.className = "list";
        results.innerHTML = state.searchResults.length
          ? state.searchResults.map(person => `
              <div class="person-row">
                ${img(person.avatar_url, "person-avatar")}
                <div class="grow">
                  <div class="track-title">${esc(person.display_name)}</div>
                  <div class="track-sub">
                    @${esc(person.handle)} ·
                    ${person.visibility === "private"
                      ? "Private profile"
                      : `${Number(person.followers || 0)} followers`}
                  </div>
                </div>
                <button class="secondary" data-action="follow-person"
                  data-id="${person.user_id}">
                  ${person.follow_state === "accepted"
                    ? "Following"
                    : person.follow_state === "pending"
                      ? "Requested"
                      : "Follow"}
                </button>
                <button class="icon-btn" data-action="open-person"
                  data-handle="${esc(person.handle)}">›</button>
              </div>
            `).join("")
          : '<div class="empty">No people found.</div>';

      } else {
        results.className = "grid";
        results.innerHTML = state.searchResults.length
          ? state.searchResults.map(playlistCard).join("")
          : '<div class="empty" style="grid-column:1/-1">No public playlists found.</div>';
      }

      status.textContent =
        `${state.searchResults.length} result${state.searchResults.length === 1 ? "" : "s"}`;

    } catch (error) {
      if (requestId !== state.searchRequest) return;
      status.textContent = error.message;
    }
  }

  function setSearchMode(mode) {
    if (!["music", "people", "playlists"].includes(mode)) return;
    state.searchMode = mode;

    document.querySelectorAll("[data-search-mode]").forEach(button => {
      button.classList.toggle("active", button.dataset.searchMode === mode);
    });

    runSearch();
  }

  async function loadLibrary() {
    $("page-library").innerHTML = `
      <div class="eyebrow">Your collection</div>
      <div class="row" style="justify-content:space-between">
        <h1 class="page-title">Your Library</h1>
        <button class="primary" data-action="create-playlist">＋ Create</button>
      </div>
      <div class="pill-row">
        <button class="pill" data-library-scope="mine">Playlists</button>
        <button class="pill" data-library-scope="following">Following</button>
        <button class="pill" data-library-scope="collaborating">Collaborating</button>
        <button class="pill" data-library-scope="liked">Liked songs</button>
      </div>
      <div id="libraryItems" class="grid" style="margin-top:14px"></div>
    `;

    await showLibraryScope("mine");
  }

  async function showLibraryScope(scope) {
    state.libraryScope = scope;

    document.querySelectorAll("[data-library-scope]").forEach(button => {
      button.classList.toggle("active", button.dataset.libraryScope === scope);
    });

    const target = $("libraryItems");
    if (!target) return;

    target.className = scope === "liked" ? "list" : "grid";
    target.innerHTML = '<div class="empty">Loading…</div>';

    try {
      if (scope === "liked") {
        const data = await api("/api/library/liked-tracks?limit=50");
        state.liked = data.results || [];

        target.innerHTML = state.liked.length
          ? state.liked.map((track, index) => trackRow(track, index)).join("")
          : '<div class="empty">Songs you like will live here.</div>';

      } else {
        const data = await api(
          `/api/playlists?scope=${encodeURIComponent(scope)}&limit=50`
        );
        const items = data.results || [];

        if (scope === "mine") state.playlists = items;

        target.innerHTML = items.length
          ? items.map(playlistCard).join("")
          : '<div class="empty" style="grid-column:1/-1">Nothing here yet.</div>';
      }

    } catch (error) {
      target.innerHTML =
        `<div class="empty" style="grid-column:1/-1">${esc(error.message)}</div>`;
    }
  }

  function renderGroups() {
    const preset = new URLSearchParams(location.search).get("chat_id") || "";
    const value = state.selectedGroup?.chat_id || preset;

    $("page-groups").innerHTML = `
      <div class="eyebrow">Telegram voice chats</div>
      <h1 class="page-title">Group player</h1>
      <p class="muted small">
        Connect a group to control its voice-chat playback.
        Your personal player remains separate.
      </p>
      <div class="searchbar">
        <span>＃</span>
        <input id="groupIdInput" inputmode="numeric"
          placeholder="Supergroup ID · -100…" value="${esc(value)}">
      </div>
      <button class="primary" data-action="check-group">Connect group</button>
      <div id="groupStatusPanel" style="margin-top:18px">
        <div class="empty">
          ${state.selectedGroup
            ? "Checking selected group…"
            : "Enter a supergroup ID to connect."}
        </div>
      </div>
    `;

    if (state.selectedGroup) {
      refreshGroupStatus().catch(error => {
        const panel = $("groupStatusPanel");
        if (panel) panel.innerHTML =
          `<div class="empty group-error">${esc(error.message)}</div>`;
      });
    }
  }

  async function refreshGroupStatus() {
    if (!state.selectedGroup) {
      throw new Error("Connect a group first.");
    }

    const panel = $("groupStatusPanel");
    if (!panel) return;

    const data = await api(
      `/api/groups/${encodeURIComponent(state.selectedGroup.chat_id)}/status`
    );

    state.groupStatus = data.group;
    const group = data.group;
    const current = group.current;

    panel.innerHTML = `
      <div class="group-panel">
        <div class="row">
          <div class="grow">
            <div class="track-title">${esc(group.title)}</div>
            <div class="track-sub">
              ${esc(group.chat_id)} · You: ${esc(group.user_status)}
            </div>
          </div>
          <span class="small ${group.can_control ? "group-ok" : "muted"}">
            ${group.can_control ? "Control access" : "View only"}
          </span>
        </div>
      </div>

      <div class="section-head">
        <h2>Now playing</h2>
        <span class="small muted">
          ${group.active ? (group.playing ? "Playing" : "Paused") : "Not playing"}
        </span>
      </div>

      ${current ? `
        <div class="track-row">
          ${img(current.thumbnail, "track-cover")}
          <div class="grow">
            <div class="track-title">${esc(current.title)}</div>
            <div class="track-sub">
              ${esc(current.artist)} · ${shortTime(current.duration_sec)}
            </div>
          </div>
        </div>
      ` : '<div class="empty">Nothing is playing in this group.</div>'}

      ${group.can_control ? `
        <div class="detail-actions">
          ${group.active ? `
            <button class="secondary" data-action="group-control"
              data-command="${group.playing ? "pause" : "resume"}">
              ${group.playing ? "Ⅱ Pause" : "▶ Resume"}
            </button>
            <button class="secondary" data-action="group-control"
              data-command="skip">Next »</button>
            <button class="danger" data-action="group-control"
              data-command="stop">Stop</button>
          ` : `
            <span class="small muted">
              Search for a song or open a playlist to start group playback.
            </span>
          `}
          <button class="secondary" data-action="refresh-group">↻ Refresh</button>
        </div>
      ` : `
        <div class="empty">
          You are a group member, but only group admins or authorized users
          can control playback.
        </div>
        <button class="secondary" data-action="refresh-group">↻ Refresh</button>
      `}

      <div class="section-head">
        <h2>Up next</h2>
        <span class="small muted">${Number(group.queue_count || 0)} songs</span>
      </div>

      <div class="list">
        ${(group.queue || []).map(track => `
          <div class="track-row">
            ${img(track.thumbnail, "track-cover")}
            <div class="grow">
              <div class="track-title">${esc(track.title)}</div>
              <div class="track-sub">${esc(track.artist)}</div>
            </div>
          </div>
        `).join("") || '<div class="small muted">The queue is empty.</div>'}
      </div>
    `;
  }

  async function connectGroup() {
    const input = $("groupIdInput");
    const raw = input?.value.trim() || "";

    if (!/^-100\d{6,13}$/.test(raw)) {
      showToast("Enter a valid supergroup ID starting with -100.");
      return;
    }

    const chatId = Number(raw);
    if (!Number.isSafeInteger(chatId)) {
      showToast("That group ID is outside the supported range.");
      return;
    }

    const panel = $("groupStatusPanel");
    panel.innerHTML = '<div class="empty">Checking membership and assistant…</div>';

    try {
      state.selectedGroup = { chat_id: chatId };
      await refreshGroupStatus();
      showToast("✓ Group connected");

      // Refresh visible search rows so group-queue controls appear.
      if (state.page === "search" && state.searchMode === "music") {
        await runSearch();
      }

    } catch (error) {
      state.selectedGroup = null;
      state.groupStatus = null;
      panel.innerHTML =
        `<div class="empty group-error">${esc(error.message)}</div>`;
      showToast(error.message);
    }
  }

  async function groupControl(action, payload = {}) {
    if (!state.selectedGroup) {
      throw new Error("Connect a group first.");
    }

    const data = await api(
      `/api/groups/${encodeURIComponent(state.selectedGroup.chat_id)}/control`,
      {
        method: "POST",
        body: JSON.stringify({ action, ...payload })
      }
    );

    if (data.status === "queued") {
      showToast(`♫ Added to group queue${data.position !== undefined ? ` · position ${data.position + 1}` : ""}`);
    } else if (data.status === "playing") {
      showToast("♫ Group playback started");
    } else if (action === "stop") {
      showToast("Group playback stopped");
    } else {
      showToast("Group playback updated");
    }

    await refreshGroupStatus();
  }

  function renderProfile() {
    const profile = state.profile;

    if (!profile) {
      $("page-profile").innerHTML = '<div class="empty">Loading profile…</div>';
      return;
    }

    $("page-profile").innerHTML = `
      <div class="eyebrow">Your account</div>
      <div class="profile-head">
        ${profile.avatar_url
          ? `<img class="profile-big-avatar" src="${esc(profile.avatar_url)}" alt="">`
          : '<div class="profile-big-avatar cover-placeholder" style="display:grid;place-items:center;margin:0 auto 12px">♫</div>'}
        <h1 style="margin:0;font-size:25px">${esc(profile.display_name)}</h1>
        <div class="muted" style="margin-top:4px">@${esc(profile.handle)}</div>
        <p class="muted" style="font-size:13px;max-width:420px;margin:12px auto">
          ${esc(profile.bio || "")}
        </p>
        <div class="stat-row">
          <div class="stat"><strong>${Number(profile.followers || 0)}</strong><span>Followers</span></div>
          <div class="stat"><strong>${Number(profile.following || 0)}</strong><span>Following</span></div>
        </div>
        <button class="secondary" data-action="edit-profile">Edit profile</button>
      </div>

      <div class="divider"></div>
      <div class="section-head">
        <h2>Your public playlists</h2>
        <button data-page="library">Library</button>
      </div>
      <div id="profilePlaylists" class="grid"></div>

              actions = `

                <button class="secondary" data-action="follow-response"

              `;

            } else if (notification.type === "playlist_followed") {
              icon = "♫";
              message = `${actor} followed your playlist <b>${esc(payload.playlist_name)}</b>.`;
            } else if (notification.type.startsWith("collaboration_")) {
              icon = "🤝";
              message = `${actor} ${esc(notification.type.replace("collaboration_", "collaboration ").replaceAll("_", " "))} ${esc(payload.playlist_name || "your playlist")}.`;

              icon = "✦";

              icon = "✦";
              message = `You were removed from <b>${esc(payload.playlist_name)}</b>.`;
            }

            return `

  function waitForMetadata() {
    if (audio.readyState >= 1) return Promise.resolve();

    return new Promise((resolve, reject) => {
      let timer;

      const cleanup = () => {
        clearTimeout(timer);
        audio.removeEventListener("loadedmetadata", onLoaded);
        audio.removeEventListener("error", onError);
      };

      const onLoaded = () => {
        cleanup();
        resolve();
      };

      const onError = () => {
        cleanup();
        reject(new Error("Audio metadata could not load."));
      };

      audio.addEventListener("loadedmetadata", onLoaded, { once: true });
      audio.addEventListener("error", onError, { once: true });

      timer = setTimeout(() => {
        cleanup();
        reject(new Error("Audio source took too long to load."));
      }, 15000);
    });
  }

  async function playTrack(track, list = null, index = 0, resumeAt = 0) {
    if (!track) return;

    const requestId = ++state.playbackRequest;
    const nextQueue = Array.isArray(list) ? list.slice() : [track];

    const safeIndex = Math.max(
      0,
      Math.min(Number(index) || 0, Math.max(0, nextQueue.length - 1))
    );

    state.queue = nextQueue;
    state.queueIndex = safeIndex;
    state.currentTrack = { ...track };

    audio.pause();
    updatePlayer();

    try {
      // Always mint a new stream token at the moment of playback.
      const token = await api("/api/stream-token", {
        method: "POST",
        body: JSON.stringify({ video_id: track.id })
      });

      if (requestId !== state.playbackRequest) return;

      audio.src = token.stream_url;
      audio.load();

      if (resumeAt > 0) {
        await waitForMetadata();
        if (requestId !== state.playbackRequest) return;

        const duration = Number(audio.duration);
        audio.currentTime = Number.isFinite(duration) && duration > 0
          ? Math.min(resumeAt, Math.max(0, duration - .25))
          : resumeAt;
      }

      if (requestId !== state.playbackRequest) return;

      await audio.play();

      if (requestId !== state.playbackRequest) {
        audio.pause();
        return;
      }

      state.currentTrack = {
        ...track,
        stream_url: token.stream_url
      };

      state.queue[state.queueIndex] = state.currentTrack;
      updatePlayer();
      setMediaSession();

    } catch (error) {
      if (requestId !== state.playbackRequest) return;
      if (error?.name === "AbortError") return;

      console.error("Taalune playback failed:", error);
      showToast(error.message || "Unable to start this song.");
      updatePlayer();
    }
  }

  function setMediaSession() {
    if (!("mediaSession" in navigator) || !state.currentTrack) return;

    const track = state.currentTrack;

    try {
      navigator.mediaSession.metadata = new MediaMetadata({
        title: track.title || "Unknown track",
        artist: track.artist || "Unknown artist",
        album: "Taalune",
        artwork: track.thumbnail
          ? [{ src: track.thumbnail, sizes: "512x512", type: "image/jpeg" }]
          : []
      });

      navigator.mediaSession.setActionHandler("play", togglePlay);
      navigator.mediaSession.setActionHandler("pause", () => {
        audio.pause();
        updatePlayer();
      });
      navigator.mediaSession.setActionHandler("nexttrack", nextTrack);
      navigator.mediaSession.setActionHandler("previoustrack", previousTrack);

    } catch (_) {}
  }

  async function togglePlay() {
    if (!state.currentTrack) return;

    if (!audio.paused) {
      audio.pause();
      updatePlayer();
      return;
    }

    if (!audio.src) {
      await playTrack(
        state.currentTrack,
        state.queue,
        state.queueIndex
      );
      return;
    }

    const requestId = state.playbackRequest;

    try {
      await audio.play();

      if (requestId !== state.playbackRequest) return;

      updatePlayer();
      setMediaSession();

    } catch (error) {
      if (requestId !== state.playbackRequest) return;
      if (error?.name === "AbortError") return;

      // Expired/rejected URLs are recovered by minting a fresh token.
      const position = Number(audio.currentTime) || 0;

      await playTrack(
        state.currentTrack,
        state.queue,
        state.queueIndex,
        position
      );
    }
  }

  async function nextTrack() {
    if (!state.queue.length) return;

    if (state.shuffle && state.queue.length > 1) {
      let nextIndex = state.queueIndex;
      while (nextIndex === state.queueIndex) {
        nextIndex = Math.floor(Math.random() * state.queue.length);
      }
      state.queueIndex = nextIndex;

    } else if (state.queueIndex + 1 < state.queue.length) {
      state.queueIndex++;

    } else if (state.repeat && state.currentTrack) {
      await playTrack(
        state.currentTrack,
        state.queue,
        state.queueIndex
      );
      return;

    } else {
      state.playbackRequest++;
      audio.pause();
      audio.removeAttribute("src");
      audio.load();
      state.currentTrack = null;
      state.queue = [];
      state.queueIndex = -1;
      updatePlayer();
      return;
    }

    await playTrack(
      state.queue[state.queueIndex],
      state.queue,
      state.queueIndex
    );
  }

  async function previousTrack() {
    if (audio.currentTime > 3) {
      audio.currentTime = 0;
      return;
    }

    if (state.queueIndex > 0) {
      state.queueIndex--;
      await playTrack(
        state.queue[state.queueIndex],
        state.queue,
        state.queueIndex
      );
    }
  }

  async function reorderPlaylist(trackId, direction) {
    const playlist = state.activePlaylist;
    if (!playlist) throw new Error("Playlist is not open.");

    const tracks = playlist.tracks.slice();
    const from = tracks.findIndex(
      track => String(track.id) === String(trackId)
    );
    const to = from + direction;

    if (from < 0 || to < 0 || to >= tracks.length) return;

    [tracks[from], tracks[to]] = [tracks[to], tracks[from]];

    const result = await api(
      `/api/playlists/${encodeURIComponent(playlist.id)}/tracks/order`,
      {
        method: "PUT",
        body: JSON.stringify({
          track_ids: tracks.map(track => track.id),
          version: playlist.version
        })
      }
    );

    state.activePlaylist = result.playlist;
    renderPlaylist();
    showToast("↕️ Playlist order updated");
  }

  document.addEventListener("click", async event => {
    const pageButton = event.target.closest("[data-page]");
    if (pageButton) {
      go(pageButton.dataset.page);
      return;
    }

    const modeButton = event.target.closest("[data-search-mode]");
    if (modeButton) {
      setSearchMode(modeButton.dataset.searchMode);
      return;
    }

    const scopeButton = event.target.closest("[data-library-scope]");
    if (scopeButton) {
      await showLibraryScope(scopeButton.dataset.libraryScope);
      return;
    }

    const button = event.target.closest("[data-action]");
    if (!button) return;

    const action = button.dataset.action;
    const id = button.dataset.id;

    try {
      if (action === "notifications") {
        go("notifications");

      } else if (action === "profile") {
        go("profile");

      } else if (action === "create-playlist") {
        createPlaylistSheet();

      } else if (action === "close-sheet") {
        closeSheet();

      } else if (action === "close-queue") {
        $("queueOverlay").classList.remove("open");

      } else if (action === "open-playlist") {
        await openPlaylist(id);

      } else if (action === "open-person") {
        await openPerson(button.dataset.handle);

      } else if (action === "check-group") {
        await connectGroup();

      } else if (action === "refresh-group") {
        await refreshGroupStatus();
        showToast("🔄 Group status updated");

      } else if (action === "group-control") {
        await groupControl(button.dataset.command);

      } else if (action === "group-track") {
        const track = [
          ...state.searchResults,
          ...(state.activePlaylist?.tracks || []),
          ...state.liked
        ].find(item => String(item.id) === String(id));

        if (!track) {
          throw new Error("Song details are unavailable. Search again.");
        }

        await groupControl("queue_track", {
          track: {
            id: track.id,
            title: track.title,
            artist: track.artist || "Unknown artist",
            duration_sec: Number(track.duration_sec || 0),
            thumbnail: track.thumbnail || null
          }
        });

      } else if (action === "group-play-playlist") {
        if (!state.activePlaylist) throw new Error("Open a playlist first.");
        await groupControl("play_playlist", {
          playlist_id: state.activePlaylist.id
        });

      } else if (action === "group-queue-playlist") {
        if (!state.activePlaylist) throw new Error("Open a playlist first.");
        await groupControl("queue_playlist", {
          playlist_id: state.activePlaylist.id
        });

      } else if (action === "play-track") {
        const list = state.page === "playlist"
          ? (state.activePlaylist?.tracks || [])
          : state.page === "library" && state.libraryScope === "liked"
            ? state.liked
            : state.searchResults;

        const track = list.find(item => String(item.id) === String(id))
          || [
            ...state.searchResults,
            ...state.liked,
            ...(state.activePlaylist?.tracks || [])
          ].find(item => String(item.id) === String(id));

        if (track) {
          const playbackList = list.some(item => item.id === track.id)
            ? list
            : [track];
          const index = playbackList.findIndex(item => item.id === track.id);
          await playTrack(track, playbackList, Math.max(0, index));
        }

      } else if (action === "add-track") {
        const track = state.searchResults.find(
          item => String(item.id) === String(id)
        );

        if (!track) {
          throw new Error("Song details are unavailable. Search again.");
        }

        if (state.addTargetPlaylist) {
          const playlistId = state.addTargetPlaylist;

          await api(
            `/api/playlists/${encodeURIComponent(playlistId)}/tracks`,
            {
              method: "POST",
              body: JSON.stringify({
                id: track.id,
                title: track.title,
                artist: track.artist || "Unknown artist",
                duration_sec: Number(track.duration_sec || 0),
                thumbnail: track.thumbnail || null
              })
            }
          );

          state.addTargetPlaylist = null;
          showToast("＋ Song added to playlist");

          if (state.activePlaylist?.id === playlistId) {
            await reloadActivePlaylist();
          }

        } else {
          if (!state.playlists.length) {
            const data = await api("/api/playlists?scope=mine&limit=50");
            state.playlists = data.results || [];
          }

          addTrackSheet(track);
        }

      } else if (action === "like-track") {
        const track = [
          ...state.searchResults,
          ...state.liked,
          ...(state.activePlaylist?.tracks || [])
        ].find(item => String(item.id) === String(id)) || state.currentTrack;

        if (!track) throw new Error("Song details are unavailable.");

        if (state.page === "library" && state.libraryScope === "liked") {
          await api(`/api/tracks/${encodeURIComponent(id)}/like`, {
            method: "DELETE"
          });
          await showLibraryScope("liked");
          showToast("Removed from Liked Songs");

        } else {
          await api(`/api/tracks/${encodeURIComponent(id)}/like`, {
            method: "POST",
            body: JSON.stringify(track)
          });
          button.textContent = "♥";
          showToast("Added to Liked Songs");
        }

      } else if (action === "playlist-follow") {
        const data = await api(`/api/playlists/${encodeURIComponent(id)}`);
        const playlist = data.playlist;
        const method = playlist.followed ? "DELETE" : "POST";

        await api(`/api/playlists/${encodeURIComponent(id)}/follow`, { method });
        showToast(playlist.followed ? "Playlist unfollowed" : "Playlist followed");

        if (state.activePlaylist?.id === id) {
          await reloadActivePlaylist();
        } else if (state.page === "home") {
          await loadHome();
        } else if (state.page === "library") {
          await showLibraryScope(state.libraryScope);
        }

      } else if (action === "like-playlist") {
        const playlist = state.activePlaylist;
        if (!playlist) throw new Error("Playlist is not open.");

        await api(`/api/playlists/${encodeURIComponent(playlist.id)}/like`, {
          method: playlist.liked ? "DELETE" : "POST"
        });
        await reloadActivePlaylist();

      } else if (action === "play-playlist") {
        const playlist = state.activePlaylist;
        if (!playlist?.tracks?.length) {
          throw new Error("This playlist is empty.");
        }
        await playTrack(playlist.tracks[0], playlist.tracks, 0);

      } else if (action === "edit-playlist") {
        editPlaylistSheet();

      } else if (action === "save-playlist-edit") {
        const playlist = state.activePlaylist;
        const body = {
          name: $("editPlaylistName").value,
          description: $("editPlaylistDescription").value,
          cover_url: $("editPlaylistCover").value || null,
          icon: $("editPlaylistIcon").value || "♫"
        };
        const visibility = $("editPlaylistVisibility");
        if (visibility) body.visibility = visibility.value;

        const result = await api(
          `/api/playlists/${encodeURIComponent(playlist.id)}`,
          {
            method: "PATCH",
            body: JSON.stringify(body)
          }
        );

        state.activePlaylist = result.playlist;
        closeSheet();
        renderPlaylist();
        showToast("Playlist updated");

      } else if (action === "save-playlist") {
        const body = {
          name: $("newPlaylistName").value,
          description: $("newPlaylistDescription").value,
          visibility: $("newPlaylistVisibility").value,
          cover_url: $("newPlaylistCover").value || null,
          icon: $("newPlaylistIcon").value || "♫"
        };

        const result = await api("/api/playlists", {
          method: "POST",
          body: JSON.stringify(body)
        });

        closeSheet();
        showToast("Playlist created");
        await openPlaylist(result.playlist.id);

      } else if (action === "confirm-add-track") {
        const playlistId = $("targetPlaylist").value;
        if (!playlistId || !state.modalTrack) {
          throw new Error("Choose a playlist first.");
        }

        await api(
          `/api/playlists/${encodeURIComponent(playlistId)}/tracks`,
          {
            method: "POST",
            body: JSON.stringify(state.modalTrack)
          }
        );

        closeSheet();
        showToast("Song added to playlist");

        if (state.activePlaylist?.id === playlistId) {
          await reloadActivePlaylist();
        }

      } else if (action === "add-from-search") {
        state.addTargetPlaylist = state.activePlaylist?.id || null;
        state.searchMode = "music";
        go("search");
        showToast("Search for a song, then tap ＋ to add it.");

      } else if (action === "invite-collaborator") {
        await inviteSheet();

      } else if (action === "delete-playlist") {
        if (!state.activePlaylist) return;

        if (!confirm("Delete this playlist? It will be hidden from everyone.")) {
          return;
        }

        await api(
          `/api/playlists/${encodeURIComponent(state.activePlaylist.id)}`,
          { method: "DELETE" }
        );

        state.activePlaylist = null;
        showToast("Playlist deleted");
        go("library");

      } else if (action === "select-invitee") {
        state.selectedInvite = Number(id);
        const send = $("sendInviteButton");
        if (send) send.disabled = false;
        await searchInvitePeople();

      } else if (action === "send-invite") {
        if (!state.selectedInvite) {
          throw new Error("Choose a person first.");
        }

        const playlistId = $("invitePlaylist").value;

        await api(
          `/api/playlists/${encodeURIComponent(playlistId)}/invitations`,
          {
            method: "POST",
            body: JSON.stringify({
              user_id: state.selectedInvite,
              role: $("inviteRole").value
            })
          }
        );

        closeSheet();
        showToast("🤝 Collaboration invitation sent");

      } else if (action === "invitation") {
        await api(
          `/api/invitations/${encodeURIComponent(id)}/respond`,
          {
            method: "POST",
            body: JSON.stringify({ action: button.dataset.choice })
          }
        );

        showToast(
          button.dataset.choice === "accept"
            ? "Invitation accepted"
            : "Invitation declined"
        );
        await loadNotifications();

      } else if (action === "follow-response") {
        await api(
          `/api/people/${encodeURIComponent(id)}/follow-response`,
          {
            method: "POST",
            body: JSON.stringify({ action: button.dataset.choice })
          }
        );

        showToast("Follow request updated");
        await loadNotifications();

      } else if (action === "follow-person") {
        const result = await api(
          `/api/people/${encodeURIComponent(id)}/follow`,
          { method: "POST" }
        );

        button.textContent = result.status === "pending"
          ? "Requested"
          : "Following";

        showToast(
          result.status === "pending"
            ? "Follow request sent"
            : "Following"
        );

      } else if (action === "read-notification") {
        await api(
          `/api/notifications/${encodeURIComponent(id)}/read`,
          { method: "POST" }
        );

        button.textContent = "Read";
        button.closest(".notification")?.classList.remove("unread");

      } else if (action === "edit-profile") {
        editProfileSheet();

      } else if (action === "save-profile") {
        const body = {
          handle: $("profileHandle").value,
          display_name: $("profileName").value,
          bio: $("profileBio").value,
          avatar_url: $("profileAvatar").value || null,
          visibility: $("profileVisibility").value,
          discoverable: $("profileDiscoverable").value === "true"
        };

        const result = await api("/api/profile", {
          method: "PATCH",
          body: JSON.stringify(body)
        });

        state.profile = result.profile;
        setAvatar();
        closeSheet();
        renderProfile();
        showToast("Profile updated");

      } else if (action === "toggle-profile-privacy") {
        const visibility = state.profile.visibility === "public"
          ? "private"
          : "public";

        const result = await api("/api/profile", {
          method: "PATCH",
          body: JSON.stringify({ visibility })
        });

        state.profile = result.profile;
        renderProfile();
        showToast("Profile privacy updated");

      } else if (action === "remove-track") {
        const playlist = state.activePlaylist;
        if (!playlist) throw new Error("Playlist is not open.");

        if (!confirm("Remove this song from the playlist?")) return;

        await api(
          `/api/playlists/${encodeURIComponent(playlist.id)}/tracks/${encodeURIComponent(id)}`,
          { method: "DELETE" }
        );

        await reloadActivePlaylist();
        showToast("🗑️ Song removed from playlist");

      } else if (action === "move-track-up" || action === "move-track-down") {
        await reorderPlaylist(
          id,
          action === "move-track-up" ? -1 : 1
        );

      } else if (action === "remove-collaborator") {
        if (!state.activePlaylist) return;
        if (!confirm("Remove this collaborator from the playlist?")) return;

        await api(
          `/api/playlists/${encodeURIComponent(state.activePlaylist.id)}/collaborators/${encodeURIComponent(id)}`,
          { method: "DELETE" }
        );

        await reloadActivePlaylist();
        showToast("Collaborator removed");

      } else if (action === "change-collaborator") {
        if (!state.activePlaylist) return;

        const role = prompt(
          "New role: editor, contributor or viewer",
          "editor"
        );

        if (!role) return;

        if (!["editor", "contributor", "viewer"].includes(role)) {
          throw new Error("Choose editor, contributor or viewer.");
        }

        await api(
          `/api/playlists/${encodeURIComponent(state.activePlaylist.id)}/collaborators/${encodeURIComponent(id)}`,
          {
            method: "PATCH",
            body: JSON.stringify({ role })
          }
        );

        await reloadActivePlaylist();
        showToast("Collaborator role updated");

      } else if (action === "open-player") {
        $("fullPlayer").classList.add("open");

      } else if (action === "close-player") {
        $("fullPlayer").classList.remove("open");

      } else if (action === "toggle-play") {
        await togglePlay();

      } else if (action === "next-track") {
        await nextTrack();

      } else if (action === "previous-track") {
        await previousTrack();

      } else if (action === "shuffle") {
        state.shuffle = !state.shuffle;
        button.style.color = state.shuffle ? "var(--accent)" : "";

      } else if (action === "repeat") {
        state.repeat = !state.repeat;
        button.style.color = state.repeat ? "var(--accent)" : "";

      } else if (action === "queue") {
        openQueue();

      } else if (action === "queue-play") {
        const index = Number(button.dataset.index);
        if (!state.queue[index]) return;

        await playTrack(state.queue[index], state.queue, index);
        $("queueOverlay").classList.remove("open");

      } else if (action === "queue-remove") {
        const index = Number(button.dataset.index);
        if (!Number.isInteger(index) || !state.queue[index]) return;

        if (index === state.queueIndex) {
          if (state.queue.length === 1) {
            state.playbackRequest++;
            audio.pause();
            audio.removeAttribute("src");
            audio.load();
            state.queue = [];
            state.queueIndex = -1;
            state.currentTrack = null;
            updatePlayer();
          } else {
            const nextIndex = index < state.queue.length - 1
              ? index + 1
              : index - 1;
            const next = state.queue[nextIndex];
            state.queue.splice(index, 1);
            state.queueIndex = nextIndex > index ? nextIndex - 1 : nextIndex;
            await playTrack(next, state.queue, state.queueIndex);
          }
        } else {
          state.queue.splice(index, 1);
          if (index < state.queueIndex) state.queueIndex--;
        }

        openQueue();

      } else if (action === "like-current") {
        if (!state.currentTrack) return;

        await api(
          `/api/tracks/${encodeURIComponent(state.currentTrack.id)}/like`,
          {
            method: "POST",
            body: JSON.stringify(state.currentTrack)
          }
        );

        showToast("Added to Liked Songs");
      }

    } catch (error) {
      showToast(error.message || "Something went wrong");
    }
  });

  document.addEventListener("input", event => {
    if (event.target.id === "searchInput") {
      clearTimeout(searchTimer);
      searchTimer = setTimeout(runSearch, 320);
    }
  });

  document.addEventListener("keydown", event => {
    if (event.target.id === "searchInput" && event.key === "Enter") {
      event.preventDefault();
      runSearch();
    }
  });

  document.addEventListener("dragstart", event => {
    const row = event.target.closest(".track-row[draggable='true']");
    if (!row) return;

    state.dragId = row.dataset.trackId;
    row.classList.add("dragging");

    if (event.dataTransfer) {
      event.dataTransfer.effectAllowed = "move";
      event.dataTransfer.setData("text/plain", state.dragId);
    }
  });

  document.addEventListener("dragover", event => {
    const row = event.target.closest(".track-row[draggable='true']");
    if (!row || !state.dragId) return;

    event.preventDefault();
    row.classList.add("drag-over");
  });

  document.addEventListener("dragleave", event => {
    event.target.closest(".track-row")?.classList.remove("drag-over");
  });

  document.addEventListener("drop", async event => {
    const row = event.target.closest(".track-row[draggable='true']");
    if (!row || !state.dragId || !state.activePlaylist) return;

    event.preventDefault();

    const playlist = state.activePlaylist;
    const tracks = playlist.tracks.slice();
    const from = tracks.findIndex(track => track.id === state.dragId);
    const to = Number(row.dataset.index);

    if (from < 0 || to < 0 || to >= tracks.length || from === to) {
      state.dragId = null;
      return;
    }

    const [moved] = tracks.splice(from, 1);
    tracks.splice(to, 0, moved);

    try {
      const result = await api(
        `/api/playlists/${encodeURIComponent(playlist.id)}/tracks/order`,
        {
          method: "PUT",
          body: JSON.stringify({
            track_ids: tracks.map(track => track.id),
            version: playlist.version
          })
        }
      );

      state.activePlaylist = result.playlist;
      renderPlaylist();
      showToast("↕️ Playlist order updated");

    } catch (error) {
      await reloadActivePlaylist();
      showToast(error.message);

    } finally {
      state.dragId = null;
    }
  });

  document.addEventListener("dragend", () => {
    state.dragId = null;
    document.querySelectorAll(".dragging,.drag-over").forEach(el => {
      el.classList.remove("dragging", "drag-over");
    });
  });

  $("seek").addEventListener("input", () => {
    if (Number.isFinite(audio.duration) && audio.duration > 0) {
      audio.currentTime =
        (Number($("seek").value) / 1000) * audio.duration;
    }
  });

  audio.addEventListener("timeupdate", () => {
    const duration = Number(audio.duration) || 0;
    const current = Number(audio.currentTime) || 0;
    const progress = duration > 0 ? current / duration : 0;

    $("miniProgress").style.width = `${progress * 100}%`;
    $("seek").value = String(Math.round(progress * 1000));
    $("elapsed").textContent = shortTime(current);
    $("remaining").textContent = `-${shortTime(Math.max(0, duration - current))}`;
  });

  audio.addEventListener("play", updatePlayer);
  audio.addEventListener("pause", updatePlayer);

  audio.addEventListener("ended", async () => {
    if (state.repeat && state.currentTrack) {
      await playTrack(
        state.currentTrack,
        state.queue,
        state.queueIndex
      );
    } else {
      await nextTrack();
    }
  });

  audio.addEventListener("error", () => {
    if (state.currentTrack) {
      showToast("This audio stream is unavailable. Try playing it again.");
    }
  });

  async function boot() {
    if (!initData) {
      document.querySelector("main").innerHTML = `
        <div class="empty" style="margin-top:40px">
          Open Taalune from the Telegram bot to sign in securely.
        </div>
      `;
      document.querySelector(".bottom-nav").style.display = "none";
      return;
    }

    try {
      await loadProfile();
      await loadHome();
    } catch (error) {
      showToast(error.message);
    }
  }

  boot();
})();
</script>
</body>
</html>
